name: Profile stats

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Cache fonts
        uses: actions/cache@v4
        with:
          path: scripts/fonts/*.ttf
          key: fonts-${{ hashFiles('scripts/lib/type.mjs') }}

      - run: npm ci

      - name: Build stats cards
        run: npm run stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}

      - name: Validate SVGs
        run: python3 scripts/check_svg.py

      - name: Commit refreshed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(stats): refresh stats cards [skip ci]"
            git push
          fi
