name: Contribution snake

on:
  schedule:
    - cron: '41 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#3F6FB5&color_dots=#E9F0FA,#C6DCF2,#8FC0E8,#5B95D6,#3F6FB5
            dist/snake-dark.svg?palette=github-dark&color_snake=#8FD3E8&color_dots=#161b22,#1E3A5F,#2F5E94,#5B95D6,#8FD3E8

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
